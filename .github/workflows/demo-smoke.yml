name: Demo Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81

      - name: Build grap-cli
        run: cargo build --release --bin grap-cli --features "fulltext,sharding"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install demo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/python/requirements.txt

      - name: Run smoke test
        run: |
          python -m demo.python.smoke_test --keep
          echo "Smoke test completed successfully"