name: Demo Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ps-scripts-parse:
    # The Windows demo scripts have no runtime coverage in CI; at minimum
    # every committed .ps1 must pass the PowerShell language parser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell scripts must parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) {
              $failed = $true
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All .ps1 scripts parse cleanly."

  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81

      - name: Build grap-cli
        run: cargo build --release --bin grap-cli --features "fulltext,sharding"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install demo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r demo/python/requirements.txt

      - name: Run smoke test
        run: |
          python -m demo.python.smoke_test --keep
          echo "Smoke test completed successfully"