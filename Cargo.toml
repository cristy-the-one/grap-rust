[package]
name = "grap"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Grok + User"]
description = "Rust-native knowledge graph engine for interconnected text documents with property-weighted, bitmask-filtered edges. Hot topology + cold blob store + BM25 seed index."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/grap-rust"  # placeholder
readme = "README.md"
keywords = ["graph", "knowledge-graph", "search", "retrieval", "bm25"]
categories = ["database-implementations", "text-processing"]

[lib]
name = "grap"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[dependencies.memmap2]
version = "0.9"
optional = true

[dependencies.crc32fast]
version = "1"
optional = true

[features]
default = []
mmap = ["memmap2", "crc32fast"]
fulltext = []
sharding = []

[dev-dependencies]
tempfile = "3"


[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
