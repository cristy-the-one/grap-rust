[package]
name = "grap"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["The grap Contributors"]
description = "A fast, read-optimized Rust knowledge graph engine with property bitmask pruning, BM25 full-text search, sharding with ghost edges, and atomic persistence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/grap-rust"
documentation = "https://docs.rs/grap"
readme = "README.md"
keywords = ["graph", "knowledge-graph", "search", "retrieval", "bm25"]
categories = ["database-implementations", "text-processing"]
exclude = [
    "core_graph_design.md",
    "docs/",
    "target/",
    ".devcontainer/",
    ".github/",
    "benches/",
    "examples/",
]

[workspace]
members = ["spikes/on_disk_index", "crates/pygrap"]
resolver = "2"

[lib]
name = "grap"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
serde_json = "1"
bincode = "3.0"
thiserror = "2"
log = "0.4"
tempfile = "3"
sha2 = "0.11"
clap = { version = "4.5", features = ["derive"] }

[dependencies.memmap2]
version = "0.9"
optional = true

[dependencies.crc32fast]
version = "1"
optional = true

[dependencies.hnsw_rs]
version = "0.3"
optional = true

[features]
default = []
mmap = ["memmap2", "crc32fast"]
fulltext = []
sharding = []
telemetry = []  # Enables the Telemetry trait and observability hooks
ann-hnsw = ["hnsw_rs"]  # Experimental: HNSW ANN backend for vector search (Phase 1)

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }


[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "graph_benches"
harness = false
required-features = ["fulltext", "sharding"]

[[bench]]
name = "engine_workloads"
harness = false
