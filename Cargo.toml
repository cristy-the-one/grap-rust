[package]
name = "grap"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["spikes/on_disk_index"]
resolver = "2"
rust-version = "1.81"
authors = ["The grap Contributors"]
description = "A fast, read-optimized Rust knowledge graph engine with property bitmask pruning, BM25 full-text search, sharding with ghost edges, and atomic persistence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/grap-rust"
documentation = "https://docs.rs/grap"
readme = "README.md"
keywords = ["graph", "knowledge-graph", "search", "retrieval", "bm25"]
categories = ["database-implementations", "text-processing"]
exclude = [
    "core_graph_design.md",
    "docs/",
    "target/",
    ".devcontainer/",
    ".github/",
    "benches/",
    "examples/",
]

[lib]
name = "grap"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1"
log = "0.4"
tempfile = "3"

[dependencies.memmap2]
version = "0.9"
optional = true

[dependencies.crc32fast]
version = "1"
optional = true

[features]
default = []
mmap = ["memmap2", "crc32fast"]
fulltext = []
sharding = []
telemetry = []  # Enables the Telemetry trait and observability hooks
on-disk-index = []  # Experimental: use segmented on-disk inverted index (0.2 work)

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }


[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "graph_benches"
harness = false
required-features = ["fulltext", "sharding"]
