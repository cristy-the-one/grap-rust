[package]
name = "pygrap"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false
authors = ["The grap Contributors"]
description = "Python bindings for the grap knowledge graph engine (internal/WIP)"
license = "MIT OR Apache-2.0"

[lib]
name = "pygrap"
crate-type = ["cdylib"]

[dependencies]
grap = { path = "../..", features = ["fulltext", "sharding", "mmap"] }
pyo3 = { version = "0.23", features = ["extension-module"] }

[features]
default = []
# Future: add "mmap" feature here when we want to expose mmap loading from Python
# mmap = ["grap/mmap"]
